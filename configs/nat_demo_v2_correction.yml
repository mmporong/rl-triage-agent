# E4b v2 교정 제안: 읽기 도구로 근거·등록 표·skill 체크리스트를 조회하고, 계약 점검(실행당 최대 2회) 뒤 제안을 한 번 제출한다
# (evals/nat_decision_call_v2.py). system_prompt는 worker가 correction_model_call.SYSTEM 뒤에 아래 도구 규칙을 붙여 넣는다.
functions:
  e4b2_list_fact_ids: {_type: e4b2_list_fact_ids}
  e4b2_get_facts: {_type: e4b2_get_facts}
  e4b2_registry: {_type: e4b2_registry}
  e4b2_skill_checklist: {_type: e4b2_skill_checklist}
  e4b2_check_proposal: {_type: e4b2_check_proposal}
  e4b2_submit_proposal: {_type: e4b2_submit_proposal}

llms:
  nemotron:
    _type: openai
    model_name: nvidia/nemotron-3-super-120b-a12b
    base_url: https://integrate.api.nvidia.com/v1
    api_key: ${NVIDIA_API_KEY}
    temperature: 0
    max_tokens: 16384
    max_retries: 0
    request_timeout: 300
    extra_body: {reasoning_effort: none}  # 단일 호출(evals/correction_model_call.py)과 같은 추론 설정

workflow:
  _type: tool_calling_agent
  llm_name: nemotron
  tool_names: [e4b2_list_fact_ids, e4b2_get_facts, e4b2_registry, e4b2_skill_checklist, e4b2_check_proposal,
               e4b2_submit_proposal]
  max_iterations: 12  # v1 8에 점검 2회와 여유를 더했다
  max_history: 24
  handle_tool_errors: false
  truncation_retry: {max_retries: 0, token_increment: 0}
  system_prompt: |
    TOOL RULES. The facts, the registry and the skill checklist are not in the user message.
    1. Read fact IDs with e4b2_list_fact_ids, values with e4b2_get_facts, the registered corrections with e4b2_registry,
       and the six checklist items with e4b2_skill_checklist.
    2. Build the proposal object. Format rules:
       - When proposing: correction_id and recovery_mode come from the registry, and hold_reason is JSON null
         (not the string "None").
       - When holding: hold_reason is a non-empty reason, and correction_id and recovery_mode are JSON null.
       - cited_facts lists fact ids only.
       - checklist has every item number. Each value is exactly ONE fact id, or "unmet". Never join several ids with
         commas, and never put a correction id there.
    3. Call e4b2_check_proposal with the object. If it returns reasons, fix exactly those and check again.
       You may check at most 2 times in total.
    4. Pass the final object to e4b2_submit_proposal exactly once. A rejection ends the run, so never resubmit.
    After a successful submission reply with one short sentence.
