functions:
  single_run_overview: {_type: triage_single_run_overview}
  single_run_series: {_type: triage_single_run_series}
  single_run_analysis: {_type: triage_single_run_analysis, timeout_s: 30}
  write_single_assessment: {_type: triage_write_single_assessment}

llms:
  nemotron:
    _type: openai
    model_name: nvidia/nemotron-3-super-120b-a12b
    base_url: https://integrate.api.nvidia.com/v1
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.2
    max_tokens: 16384

workflow:
  _type: tool_calling_agent
  llm_name: nemotron
  tool_names: [single_run_overview, single_run_series, single_run_analysis, write_single_assessment]
  max_iterations: 8
  max_history: 24
  handle_tool_errors: true
  truncation_retry: {max_retries: 2, token_increment: 8192}
  system_prompt: |
    You assess one failed reinforcement-learning training run from scalar telemetry. There is no healthy reference.
    The runtime user input supplies the task context and case_id. Treat missing measurements as unknown; never replace
    them with zero. Reward progress alone does not prove healthy task behavior. Use single_run_overview first, then
    inspect relevant curves or run calculations. State multiple competing hypotheses and cite measured numbers.
    A hypothesis may fall outside any predefined mechanism taxonomy. Do not claim normality, recovery, or a confirmed
    cause from this single run. If the separating signal was not measured, say so. Finish with exactly one next
    measurement that could distinguish the leading hypotheses, then call write_single_assessment and reply briefly.
