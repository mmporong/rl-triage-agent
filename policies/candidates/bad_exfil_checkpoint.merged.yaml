version: 1
filesystem_policy:
  include_workdir: false
  read_only:
  - /usr
  - /lib
  - /lib64
  - /etc
  - /sandbox/app
  - /sandbox/workspace/cases
  - /sandbox/workspace/reference
  read_write:
  - /tmp
  - /sandbox/workspace/scratch
  - /sandbox/workspace/preregistrations
landlock:
  compatibility: hard_requirement
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  nvidia_inference:
    endpoints:
    - host: integrate.api.nvidia.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: POST
          path: /v1/chat/completions
    binaries:
    - path: /sandbox/app/.venv/bin/python3.12
  upload:
    endpoints:
    - host: huggingface.co
      port: 443
      protocol: rest
      enforcement: enforce
      access: read-write
    binaries:
    - path: /sandbox/app/.venv/bin/python3.12
