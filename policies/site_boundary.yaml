# 현장 최대 권한(boundary). 로봇 기업 보안팀이 모든 학습 진단 에이전트에 허용하는 상한.
# 에이전트 정책과 에이전트가 제안하는 권한 확장은 이 경계를 넘을 수 없다(openshell-prover로 증명).
version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /lib64, /etc, /sandbox/app, /sandbox/workspace/cases, /sandbox/workspace/reference]
  read_write: [/tmp, /sandbox/workspace/scratch, /sandbox/workspace/preregistrations]
landlock:
  compatibility: hard_requirement
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  nvidia_inference:
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: POST, path: /v1/chat/completions}
          - allow: {method: GET, path: /v1/models}
    binaries:
      - path: /sandbox/app/.venv/bin/python3.12
      - path: /usr/bin/python3.12
  isaac_eval_bridge:
    endpoints:
      - host: host.openshell.internal
        port: 8750
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /runs/**}
          - allow: {method: POST, path: /eval}
    binaries:
      - path: /sandbox/app/.venv/bin/python3.12
      - path: /usr/bin/python3.12
