[project]
name = "rl-triage-agent"
version = "0.1.0"
description = "Isaac Lab RL training failure triage agent on NVIDIA Nemotron, NeMo Agent Toolkit and OpenShell"
requires-python = ">=3.11,<3.14"
dependencies = [
  "nvidia-nat[langchain]==1.9.0",
  "openai>=1.40",
  "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.entry-points.'nat.components']
rl_triage = "rl_triage.nat_functions"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rl_triage"]
